services:
  # 1. AI Service (Python FastAPI + Scikit-Learn Random Forest)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: lixilearn-ai-service
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app
    environment:
      - ENV=development
      - CORS_ORIGINS=${AI_ALLOWED_ORIGINS:-*}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 2. React Native Web Development Environment (Tùy chọn chạy dev trong container)
  mobile-web:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: lixilearn-mobile-web
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19006:19006"
    volumes:
      - ./mobile:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - EXPO_PUBLIC_AI_SERVICE_URL=${EXPO_PUBLIC_AI_SERVICE_URL:-http://localhost:8000}
    restart: unless-stopped

