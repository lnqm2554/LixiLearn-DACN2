services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      CORS_ORIGINS: ${AI_ALLOWED_ORIGINS:?Set AI_ALLOWED_ORIGINS to the deployed web app origin}
      PYTHONDONTWRITEBYTECODE: "1"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
